# Mantle Gateway model catalog.
#
# Copy to config/models.yaml (Docker Compose mounts it into the container) or put it in the
# k8s ConfigMap. Everything is optional: with no file, the gateway lists whatever Mantle's
# /v1/models returns and routes each model with built-in rules.
#
# Routing rules used when `api` / `base` are not set:
#   *claude*                    -> api: messages   (Anthropic Messages at /anthropic/v1/messages)
#   openai.gpt-<number>...      -> api: responses, base: openai/v1
#   google.gemma-4*, xai.grok*  -> api: chat,      base: openai/v1
#   everything else             -> api: chat,      base: v1  (plain passthrough)

discovery: true        # also list models discovered from Mantle /v1/models
allow_list: false      # true = expose ONLY the models below (discovery is then ignored)
hide:                  # glob patterns hiding discovered models from /v1/models
  - "*safeguard*"

models:
  # ---- Anthropic Claude (served through the Anthropic Messages surface) -------------------------
  - id: anthropic.claude-opus-5-5
    name: Claude Opus 5.5
    alias: claude-opus-5-5
    default_effort: high       # used when the client sends no reasoning_effort
  - id: anthropic.claude-sonnet-5-5
    name: Claude Sonnet 5.5
    alias: claude-sonnet-5-5
  - id: anthropic.claude-haiku-5-5
    name: Claude Haiku 5.5
    alias: claude-haiku-5-5

  # ---- OpenAI frontier models (Responses API under /openai/v1) ----------------------------------
  - id: openai.gpt-5.5
    name: GPT-5.5
    alias: gpt-5.5

  # ---- Open-weight models (plain chat passthrough) ----------------------------------------------
  - id: openai.gpt-oss-120b
    name: gpt-oss 120B

  # ---- Embeddings (bedrock-runtime InvokeModel; hidden from /v1/models) -------------------------
  - id: amazon.titan-embed-text-v2:0
    alias: titan-embed-v2
    type: embedding
    dimensions: 1024
  - id: cohere.embed-v4:0
    alias: cohere-embed-v4
    type: embedding

# Per-model options (all optional):
#   alias              ID shown to clients (default: id)
#   name               display name (Open WebUI shows it)
#   type               chat | embedding
#   api                chat | responses | messages
#   base               v1 | openai/v1
#   max_tokens         default max output tokens when the client sends none
#   default_effort     low | medium | high | xhigh | max
#   thinking           adaptive | budget | none            (Claude only)
#   allow_sampling     forward temperature/top_p/top_k     (off for current Claude & GPT-5 models)
#   forced_tool_choice allow tool_choice=required/named    (Claude Opus/Sonnet 5.5+ reject it)
#   hidden             keep routable but hide from /v1/models
#   dimensions, input_type   embedding options (Titan v2: 256/512/1024; Cohere v4: 256..1536)
